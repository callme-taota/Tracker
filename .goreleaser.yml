version: 2

project_name: tracker

before:
  hooks:
    - sh -c "cd web && npm ci && npm run build"

builds:
  - id: tracker
    main: ./cmd/tracker
    binary: tracker
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w

archives:
  - id: tracker-bundles
    builds:
      - tracker
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - README.md
      - README.zh.md
      - .env.example
      - web/.env.example
      - configs/tracker.example.yaml
      - configs/pipeline.example.yaml
      - web/dist/**

checksum:
  name_template: checksums.txt

release:
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
